<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次登录修改密码</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 500px at 80% 0,#0b4a78,transparent 55%),#04102a;color:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.box{width:min(430px,calc(100% - 32px));padding:30px;border:1px solid rgba(94,234,212,.4);border-radius:18px;background:rgba(8,29,64,.96);box-shadow:0 30px 70px -30px #000}h1{margin:0 0 8px;font-size:23px}p{font-size:12px;color:#8fb1d2;line-height:1.7}label{display:block;font-size:11px;color:#8fb1d2;margin:16px 0 7px}input{width:100%;height:44px;border-radius:9px;border:1px solid rgba(94,234,212,.28);background:#03102b;color:#fff;padding:0 12px;box-sizing:border-box}button{width:100%;height:45px;margin-top:22px;border:0;border-radius:10px;background:linear-gradient(100deg,#0d9488,#2563eb);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:11px;color:#f0b429;min-height:18px}</style></head><body><form class="box" id="f"><h1>首次登录必须修改密码</h1><p>新密码至少 8 位，并同时包含字母和数字。修改成功后需要重新登录。</p><label>原密码</label><input id="old" type="password" required><label>新密码</label><input id="new" type="password" required><button>确认修改并重新登录</button><div class="msg" id="msg"></div></form><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const old=document.getElementById('old');const next=document.getElementById('new');msg.textContent='正在修改…';try{const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({currentPassword:old.value,newPassword:next.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);location.href='/login'}catch(err){msg.textContent=err.message}}</script></body></html>
