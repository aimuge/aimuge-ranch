        <button type="button" class="tab" data-role="aimugo">Aimugo技术</button>
      </div>
      <div class="field"><label id="accountLabel">伊拉特账号 / 手机号</label><input id="accountInput" autocomplete="username" placeholder="请输入账号或手机号"></div>
      <div class="field" id="passwordField"><label>登录密码</label><input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入登录密码"></div>
      <div class="field" id="codeField"><label>短信验证码</label><div class="code"><input id="codeInput" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码"><button id="sendCodeBtn" type="button">获取验证码</button></div></div>
      <div class="row"><label><input id="rememberInput" type="checkbox" checked> 记住此设备</label><a href="#" id="forgotLink">忘记密码</a></div>
      <button class="submit" id="loginBtn" type="submit">登 录 系 统</button>
      <button class="wechat" id="wechatBtn" type="button">微信小程序快捷登录</button>
      <div class="notice" id="loginNotice">伊拉特为牧场唯一最高管理员，可授权场长、兽医、牧工、客服等人员权限。其他账号不能修改伊拉特的最高权限。</div>
      <div class="help" id="loginHelp">遇到登录问题，请联系内蒙古艾牧戈数智科技有限公司</div>
    </form>
  </section>
</div>
<script>
const roleConfig = {
  owner:  { mode:'password', label:'牧场主账号 / 手机号', placeholder:'请输入牧场主账号或手机号' },
  service:{ mode:'password', label:'客服账号',           placeholder:'请输入客服账号' },
  aimugo: { mode:'password', label:'Aimugo技术账号',     placeholder:'请输入Aimugo技术平台账号' }
};
let role = 'owner';
const $ = id => document.getElementById(id);
const accountInput=$('accountInput'), passwordField=$('passwordField'), codeField=$('codeField');
function setRole(next){
  role=next;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.role===role));
  const c=roleConfig[role];
  $('accountLabel').textContent=c.label;
  accountInput.placeholder=c.placeholder;
  passwordField.style.display=c.mode==='password'?'block':'none';
  codeField.style.display=c.mode==='sms'?'block':'none';
  $('wechatBtn').style.display=c.mode==='sms'?'block':'none';
  $('loginBtn').textContent=c.mode==='sms'?'验证码登录':'登 录 系 统';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));
const entry = location.pathname.includes('/platform/') ? 'aimugo' : location.pathname.includes('/service/') ? 'service' : location.pathname.includes('/owner/') ? 'owner' : new URLSearchParams(location.search).get('role');
const isDedicated = location.pathname !== '/login' && location.pathname !== '/login.html';
if (isDedicated && entry && roleConfig[entry]) {
  document.querySelector('.tabs').style.display='none';
  const titles={owner:'牧场主登录',service:'客服登录',aimugo:'Aimugo技术平台登录'};
  document.querySelector('.card h2').textContent=titles[entry];
  document.querySelector('.sub').textContent=entry==='owner'?'伊拉特智慧牧场最高管理员入口':'请使用已授权账号登录，系统将进入对应工作台';
}
async function api(url,options={}){
  const r=await fetch(url,{credentials:'include',headers:{'content-type':'application/json',...(options.headers||{})},...options});
  const d=await r.json().catch(()=>({ok:false,error:'服务器返回格式错误'}));
  if(!r.ok||d.ok===false) throw new Error(d.error||`请求失败(${r.status})`);
  return d;
}
function notice(text,type='info'){
  $('loginNotice').textContent=text;
  $('loginNotice').style.borderColor=type==='error'?'rgba(239,68,68,.55)':'rgba(245,158,11,.20)';
  $('loginNotice').style.background=type==='error'?'rgba(239,68,68,.10)':'rgba(245,158,11,.08)';
}
$('sendCodeBtn').addEventListener('click',async()=>{
  const phone=accountInput.value.trim();
  if(!/^1[3-9]\d{9}$/.test(phone)) return notice('请输入正确的手机号','error');
  $('sendCodeBtn').disabled=true;$('sendCodeBtn').textContent='发送中…';
  try{
    const d=await api('/api/auth/send-code',{method:'POST',body:JSON.stringify({phone})});
    notice(d.devCode?`演示验证码：${d.devCode}（正式版不会显示）`:'验证码已发送，5分钟内有效');
    let n=60;const t=setInterval(()=>{if(--n<=0){clearInterval(t);$('sendCodeBtn').disabled=false;$('sendCodeBtn').textContent='获取验证码'}else $('sendCodeBtn').textContent=`${n}s后重试`},1000);
  }catch(e){$('sendCodeBtn').disabled=false;$('sendCodeBtn').textContent='获取验证码';notice(e.message,'error');}
});
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const account=accountInput.value.trim();
  if(!account) return notice('请输入账号或手机号','error');
  $('loginBtn').disabled=true;$('loginBtn').textContent='登录中…';
  try{
    let d;
    if(roleConfig[role].mode==='sms') d=await api('/api/auth/login/sms',{method:'POST',body:JSON.stringify({phone:account,code:$('codeInput').value.trim()})});
    else d=await api('/api/auth/login/password',{method:'POST',body:JSON.stringify({account,password:$('passwordInput').value})});
    localStorage.setItem('yilate-auth-user',JSON.stringify(d.user));
    location.href=d.user.mustChangePassword?'/change-password.html':'/index.html';
  }catch(err){notice(err.message,'error');$('loginBtn').disabled=false;$('loginBtn').textContent=roleConfig[role].mode==='sms'?'验证码登录':'登 录 系 统';}
});
$('wechatBtn').addEventListener('click',()=>notice('微信登录需要在微信小程序内授权，当前请先使用短信验证码登录','error'));
$('forgotLink').addEventListener('click',e=>{e.preventDefault();notice('请联系Aimugo技术平台管理员重置密码','error')});
setRole(entry && roleConfig[entry] ? entry : 'owner');
</script>
</body>
</html>
