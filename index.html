    <div class="brand">
      <div class="brand-logo"><img src="assets/logo-sm.webp?v=94c" alt="艾牧戈 AimuGo"></div>
      <div class="brand-text">
        <div class="brand-name">伊拉特 · 智慧牧场</div>
        <div class="brand-sub">YILATE SMART RANCH</div>
      </div>

    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">

        <div class="weather-chip" id="weatherChip"></div>
        <div class="notice" title="预警中心"><span id="noticeBadge">0</span>🔔</div>
        <button class="exit-btn" id="exitBtn" type="button" title="退出登录，返回总栏目">退出</button>
        <div class="user">
          <div class="avatar">伊</div>
          <div class="user-info">
            <div class="user-name">伊拉特 · 场主</div>
            <div class="user-role">伊拉特智慧牧场</div>
