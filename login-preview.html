<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伊拉特智慧牧场 · 统一登录</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#06142e;color:#eaf7ff}
.login{min-height:100vh;display:grid;grid-template-columns:1.18fr .82fr;position:relative;overflow:hidden}
.hero{position:relative;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(3,15,43,.88),rgba(4,25,63,.62)),url('assets/photos/grassland-green.jpg') center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(94,234,212,.12) 58%,transparent 74%);animation:scan 8s linear infinite;pointer-events:none}
@keyframes scan{0%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.logo{display:flex;align-items:center;gap:14px;position:relative;z-index:2}.logo img{width:68px;height:68px;border-radius:17px;background:#fff;padding:5px;box-shadow:0 0 30px rgba(94,234,212,.35)}
.logo b{display:block;font-size:26px;letter-spacing:1px}.logo span{display:block;margin-top:5px;color:#73d9e8;font-size:11px;letter-spacing:3px}
.hero-copy{position:relative;z-index:2;max-width:650px}.hero-copy h1{font-size:48px;line-height:1.16;margin:0 0 16px;letter-spacing:2px;background:linear-gradient(100deg,#fff,#7dd3fc,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{font-size:15px;line-height:1.9;color:#bcd6ee;margin:0}.stats{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.stats span{padding:9px 13px;border-radius:9px;border:1px solid rgba(94,234,212,.28);background:rgba(5,22,53,.66);font-size:12px;color:#cbefff}.stats b{color:#5eead4;margin-right:4px}
.hero-foot{position:relative;z-index:2;font-size:11px;color:#6f9ec4;letter-spacing:.5px}
.panel{position:relative;display:flex;align-items:center;justify-content:center;padding:44px 42px;background:radial-gradient(700px 500px at 85% 12%,rgba(34,211,238,.16),transparent 62%),linear-gradient(160deg,#081a3d,#030b21)}
.panel:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.card{position:relative;z-index:2;width:min(430px,100%);padding:30px 30px 25px;border-radius:20px;border:1px solid rgba(94,234,212,.30);background:linear-gradient(150deg,rgba(16,45,92,.94),rgba(4,15,40,.97));box-shadow:0 28px 70px -32px #000,inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px)}
.card h2{margin:0;font-size:25px;letter-spacing:1px}.sub{margin:8px 0 20px;color:#7fa6c9;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px}.tab{border:1px solid rgba(90,158,229,.22);border-radius:9px;background:rgba(255,255,255,.035);color:#9fc3e4;padding:9px 4px;font:600 12px inherit;cursor:pointer}.tab.active{background:linear-gradient(135deg,#0d9488,#2563eb);border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px #22d3ee}
.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:#8eb2d5;margin-bottom:7px}.field input{width:100%;height:45px;border-radius:10px;border:1px solid rgba(87,154,224,.30);background:rgba(2,12,33,.82);color:#eaf7ff;padding:0 13px;font-size:13px;outline:none}.field input:focus{border-color:#5eead4;box-shadow:0 0 0 3px rgba(94,234,212,.08)}
.code{display:flex;gap:8px}.code input{flex:1}.code button{width:112px;border-radius:10px;border:1px solid rgba(94,234,212,.38);background:rgba(94,234,212,.09);color:#73e7df;font-size:12px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7da2c4;margin:2px 0 18px}.row a{color:#70dcd6;text-decoration:none}
.submit{width:100%;height:47px;border:0;border-radius:11px;background:linear-gradient(100deg,#0d9488,#0891b2 54%,#2563eb);color:#fff;font-weight:800;font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 12px 28px -14px #22d3ee}
.wechat{margin-top:11px;width:100%;height:42px;border-radius:10px;border:1px solid rgba(94,234,212,.26);background:rgba(94,234,212,.06);color:#a5efe8;font-size:12px;cursor:pointer}
.notice{margin-top:16px;padding:11px 12px;border-radius:9px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.20);font-size:10px;line-height:1.6;color:#d8b977}
.help{margin-top:17px;text-align:center;font-size:10px;color:#6d91b2}
@media(max-width:820px){.login{grid-template-columns:1fr}.hero{min-height:270px;padding:28px 22px}.hero-copy h1{font-size:31px}.hero-copy p{font-size:13px}.stats{display:none}.panel{padding:28px 16px 36px;align-items:flex-start}.card{padding:24px 18px}.hero-foot{display:none}}
</style>
</head>
<body>
<div class="login">
  <section class="hero">
    <div class="logo"><img src="assets/logo.png" alt="伊拉特智慧牧场"><div><b>伊拉特智慧牧场</b><span>YILATE SMART RANCH</span></div></div>
    <div class="hero-copy">
      <h1>智慧牧场<br>一体化管理平台</h1>
      <p>养殖 · 草场 · 饲草 · 防疫 · 屠宰 · 产品 · 文旅 · 智能装备<br>一个账号进入，不同角色看到不同工作台。</p>
      <div class="stats"><span><b>186</b>西门塔尔牛</span><span><b>13,290</b>亩草场</span><span><b>9</b>项智能装备</span><span><b>24h</b>实时数据</span></div>
    </div>
    <div class="hero-foot">内蒙古艾牧戈数智科技有限公司 · 平台技术支持</div>
  </section>
  <section class="panel">
    <form class="card" id="loginForm">
      <h2>统一登录入口</h2>
      <div class="sub">伊拉特账号拥有牧场最高权限，其他角色按授权范围使用</div>
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-role="owner">伊拉特</button>
        <button type="button" class="tab" data-role="worker">牧民</button>
        <button type="button" class="tab" data-role="aimugo">艾牧戈</button>
        <button type="button" class="tab" data-role="gov">政府</button>
      </div>
      <div class="field"><label id="accountLabel">伊拉特账号 / 手机号</label><input id="accountInput" autocomplete="username" placeholder="请输入账号或手机号"></div>
      <div class="field" id="passwordField"><label>登录密码</label><input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入登录密码"></div>
      <div class="field" id="codeField"><label>短信验证码</label><div class="code"><input id="codeInput" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码"><button id="sendCodeBtn" type="button">获取验证码</button></div></div>
      <div class="row"><label><input id="rememberInput" type="checkbox" checked> 记住此设备</label><a href="#" id="forgotLink">忘记密码</a></div>
      <button class="submit" id="loginBtn" type="submit">登 录 系 统</button>
      <button class="wechat" id="wechatBtn" type="button">微信小程序快捷登录</button>
      <div class="notice" id="loginNotice">伊拉特为牧场唯一最高管理员，可授权场长、兽医、牧工、客服等人员权限。其他账号不能修改伊拉特的最高权限。</div>
      <div class="help" id="loginHelp">遇到登录问题，请联系内蒙古艾牧戈数智科技有限公司</div>
    </form>
  </section>
</div>
<script>
const roleConfig = {
  owner:  { mode:'password', label:'伊拉特账号 / 手机号', placeholder:'yilate 或绑定手机号' },
  worker: { mode:'sms',      label:'牧民手机号',         placeholder:'请输入绑定的手机号' },
  aimugo: { mode:'password', label:'艾牧戈员工账号',     placeholder:'请输入平台员工账号' },
  gov:    { mode:'password', label:'政府政务账号',       placeholder:'请输入政务只读账号' }
};
let role = 'owner';
const $ = id => document.getElementById(id);
const accountInput=$('accountInput'), passwordField=$('passwordField'), codeField=$('codeField');
function setRole(next){
  role=next;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.role===role));
  const c=roleConfig[role];
  $('accountLabel').textContent=c.label;
  accountInput.placeholder=c.placeholder;
  passwordField.style.display=c.mode==='password'?'block':'none';
  codeField.style.display=c.mode==='sms'?'block':'none';
  $('wechatBtn').style.display=c.mode==='sms'?'block':'none';
  $('loginBtn').textContent=c.mode==='sms'?'验证码登录':'登 录 系 统';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));
async function api(url,options={}){
  const r=await fetch(url,{credentials:'include',headers:{'content-type':'application/json',...(options.headers||{})},...options});
  const d=await r.json().catch(()=>({ok:false,error:'服务器返回格式错误'}));
  if(!r.ok||d.ok===false) throw new Error(d.error||`请求失败(${r.status})`);
  return d;
}
function notice(text,type='info'){
  $('loginNotice').textContent=text;
  $('loginNotice').style.borderColor=type==='error'?'rgba(239,68,68,.55)':'rgba(245,158,11,.20)';
  $('loginNotice').style.background=type==='error'?'rgba(239,68,68,.10)':'rgba(245,158,11,.08)';
}
$('sendCodeBtn').addEventListener('click',async()=>{
  const phone=accountInput.value.trim();
  if(!/^1[3-9]\d{9}$/.test(phone)) return notice('请输入正确的手机号','error');
  $('sendCodeBtn').disabled=true;$('sendCodeBtn').textContent='发送中…';
  try{
    const d=await api('/api/auth/send-code',{method:'POST',body:JSON.stringify({phone})});
    notice(d.devCode?`演示验证码：${d.devCode}（正式版不会显示）`:'验证码已发送，5分钟内有效');
    let n=60;const t=setInterval(()=>{if(--n<=0){clearInterval(t);$('sendCodeBtn').disabled=false;$('sendCodeBtn').textContent='获取验证码'}else $('sendCodeBtn').textContent=`${n}s后重试`},1000);
  }catch(e){$('sendCodeBtn').disabled=false;$('sendCodeBtn').textContent='获取验证码';notice(e.message,'error');}
});
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const account=accountInput.value.trim();
  if(!account) return notice('请输入账号或手机号','error');
  $('loginBtn').disabled=true;$('loginBtn').textContent='登录中…';
  try{
    let d;
    if(roleConfig[role].mode==='sms') d=await api('/api/auth/login/sms',{method:'POST',body:JSON.stringify({phone:account,code:$('codeInput').value.trim()})});
    else d=await api('/api/auth/login/password',{method:'POST',body:JSON.stringify({account,password:$('passwordInput').value})});
    localStorage.setItem('yilate-auth-user',JSON.stringify(d.user));
    location.href=d.user.mustChangePassword?'/change-password.html':'/index.html';
  }catch(err){notice(err.message,'error');$('loginBtn').disabled=false;$('loginBtn').textContent=roleConfig[role].mode==='sms'?'验证码登录':'登 录 系 统';}
});
$('wechatBtn').addEventListener('click',()=>notice('微信登录需要在微信小程序内授权，当前请先使用短信验证码登录','error'));
$('forgotLink').addEventListener('click',e=>{e.preventDefault();notice('请联系内蒙古艾牧戈数智科技有限公司重置密码','error')});
setRole('owner');
</script>
</body>
</html>
