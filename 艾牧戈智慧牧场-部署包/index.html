<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾牧戈 · 智慧家庭牧场一体化管理平台</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 侧边导航（栏目由系统动态渲染，可在顶栏 ⚙ 修改栏目名） -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="assets/logo.png" alt="艾牧戈 AimuGo"></div>
      <div class="brand-text">
        <div class="brand-name">艾牧戈 · 智慧牧场</div>
        <div class="brand-sub">AIMUGO SMART RANCH</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="wx-mini">📱 牧民端小程序 · 游客端小程序</div>
      <div class="sys-info">平台 v3.0 · 一体化演示版 · 呼伦贝尔</div>
    </div>
  </aside>
  <div class="mask" id="mask"></div>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="crumb" id="crumb">数据总览</div>
      <div class="topbar-right">
        <div class="iot-chip" id="iotChip" title="点击开/关智能硬件实时采集">● 实时采集</div>
        <button class="gear-btn" id="settingsBtn" title="栏目设置（可修改栏目名）">⚙️</button>
        <div class="weather-chip" id="weatherChip"></div>
        <div class="notice" title="预警中心"><span id="noticeBadge">0</span>🔔</div>
        <div class="user">
          <div class="avatar">巴</div>
          <div class="user-info">
            <div class="user-name">巴特尔 · 场主</div>
            <div class="user-role">艾牧戈家庭牧场</div>
          </div>
        </div>
      </div>
    </header>
    <section class="content" id="content"></section>
    <footer class="foot">© 2026 内蒙古艾牧戈数智科技有限公司 · 智慧畜牧业一体化管理平台 · 养殖 · 草场 · 饲草 · 屠宰 · 防疫 · 装备 · 产品 · 文旅 · 特色</footer>
  </main>
</div>
<button class="fab" id="fabBtn" title="畜牧业智能体">🤖</button>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
